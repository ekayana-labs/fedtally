[package]
name = "fedtally-core"
description = "Field arithmetic, fingerprints, the signed run log and its rules"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
aws-lc-rs = "1"
base64 = "0.22"
blake3 = { version = "1", features = ["rayon"] }
bytemuck = "1"
chacha20poly1305 = "0.10"
did-bio-core = "0.2"
getrandom = "0.3"
hex = "0.4"
pq-ucan = { version = "0.1.3", features = ["ml-dsa"] }
rand_chacha = "0.9"
rand_core = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
thiserror = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints]
workspace = true
