[workspace]
resolver = "3"
members = ["crates/fedtally-core"]
default-members = ["crates/fedtally-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/ekayana-labs/fedtally"

[workspace.dependencies]
fedtally-core = { path = "crates/fedtally-core" }
fedtally-node = { path = "crates/fedtally-node" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 4
