name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test

  ledger:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ledger
    steps:
      - uses: actions/checkout@v4
      # The version comes from ledger/rust-toolchain.toml.
      - run: rustup toolchain install
      - name: Install the Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: cargo build-sbf --manifest-path program/Cargo.toml
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Run every anchor role against a local validator
        working-directory: .
        run: cargo test -p fedtally-chain --test validator -- --ignored --test-threads=1

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install maturin ".[dev]"
      - run: cargo build --release -p fedtally-cli
      - run: pytest
        env:
          FEDTALLY_BIN: target/release/fedtally
